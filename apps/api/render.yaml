# Render Blueprint: one free-plan Docker web service for the API.
# Deploys are triggered once a day by the deploy hook (scripts/deploy.sh).
services:
  - type: web
    name: upsc-api
    runtime: docker
    plan: free
    # Keep in the same region as the Neon database (AWS ap-southeast-1) and the Vercel functions
    # (apps/web/vercel.json): every query is a round trip, and Oregon <-> Singapore costs ~180 ms each.
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
